<div class="container-form w-120">
  <h2 class="text-2xl font-bold mb-4">
    {{ title() }}
  </h2>

  <form #updateForm="ngForm" (ngSubmit)="onUpdateArtist(updateForm)">

    @if (success_message()) {
      <div class="bg-green-100 border border-green-400 text-green-700 px-4 py-3 rounded-lg mb-6">
        {{ success_message()}}
      </div>
    }

    <div class="mb-4">

      <label class="label-form">
        Nombre
      </label>

      <input type="text" name="name" [ngModel]="name()" (ngModelChange)="name.set($event)" class="input" placeholder="Introduce nombre de artista" />

    </div>

    <div class="mb-4">
      <label class="label-form">
        Descripción
      </label>

      <textarea type="text" rows="4" name="description" [ngModel]="description()" (ngModelChange)="description.set($event)"class="input" placeholder="Introduce descripción">
      </textarea>
    </div>

    <div class="mb-4 text-center">
        <label class="label-form">
            Foto del artista
        </label>
        <img
            [src]="image() ? 'http://localhost:3000/api/get-image-artist/' + image() : 'http://localhost:3000/api/get-image-artist/default.png'"
            (error)="$any($event.target).src = 'http://localhost:3000/api/get-image-artist/default.png'"
            [alt]="name()"
            class="w-32 h-32 rounded-full object-cover mx-auto mb-4"
        >
        <input type="file" #imageInput name="image" (change)="onImageSelected($event)"  accept="image/*" class="inline-block bg-gray-500 text-white px-4 py-2 rounded cursor-pointer  hover:bg-gray-600" />
    </div>

    <button type="submit" class="button-submit">
      Editar artista
    </button>

    <button type="button" class="button-back" (click)="back()">
      ← Volver
    </button>
    
  </form>
  
</div>
