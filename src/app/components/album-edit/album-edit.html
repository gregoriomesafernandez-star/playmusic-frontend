<div class="container-form w-140">
  
  @if (success_message()) {
    <div class="bg-green-100 border border-green-400 text-green-700 px-4 py-3 rounded-lg mb-6">
      {{ success_message()}}
    </div>
  }
  
  <h2 class="text-2xl font-bold mb-4">
    {{ title_update() }}
  </h2>

  <form #updateForm="ngForm" (ngSubmit)="onUpdateAlbum(updateForm)" >

    <div class="mb-4">

      <label class="label-form">
        Título
      </label>

      <input type="text" name="title" [ngModel]="title()" (ngModelChange)="title.set($event)" class="input" placeholder="Introduce nombre de artista" />

    </div>

    <div class="mb-4">
      <label class="label-form">
        Descripción
      </label>

      <textarea type="text" rows="4" name="description" [ngModel]="description()" (ngModelChange)="description.set($event)" class="input" placeholder="Introduce descripción">
      </textarea>
    </div>

    <div class="mb-4">

      <label class="label-form">
        Año
      </label>

      <input type="text" name="year" [ngModel]="year()" (ngModelChange)="year.set($event)" class="input" placeholder="Introduce nombre de artista" />

    </div>

    <div class="mb-4 text-center">
        <label class="label-form">
            Foto del album
        </label>
        <img
            [src]="image() ? 'http://localhost:3000/api/get-image-album/' + image() : 'http://localhost:3000/api/get-image-album/default.png'"
            (error)="$any($event.target).src = 'http://localhost:3000/api/get-image-album/default.png'"
            [alt]="title()"
            class="w-32 h-32 rounded-sm object-cover mx-auto mb-4"
        >
        <input type="file" #imageInput name="image" (change)="onImageSelected($event)"  accept="image/*" class="inline-block bg-gray-500 text-white px-4 py-2 rounded cursor-pointer  hover:bg-gray-600" />
    </div>

    <button type="submit" class="button-submit">
      Editar album
    </button>

    <button type="button" class="button-back" (click)="back()">
      ← Volver
    </button>

  </form>
  
</div>
