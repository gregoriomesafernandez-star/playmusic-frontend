<div class="container-form w-120">
  
  @if (success_message()) {
    <div class="bg-green-100 border border-green-400 text-green-700 px-4 py-3 rounded-lg mb-6">
      {{ success_message()}}
    </div>
  }
  
  <h2 class="text-2xl font-bold mb-4">
    {{ title() }}
  </h2>

  <form #creatForm="ngForm" (ngSubmit)="onCreateArtist(creatForm)">

    <div class="mb-4">
      <label class="label-form">
        Nombre
      </label>

      <input type="text" name="name" [(ngModel)]="name" class="input" placeholder="Introduce nombre de artista" />

    </div>

    <div class="mb-4">
      <label class="label-form">
        Descripción
      </label>

      <textarea type="text" rows="3" name="description" [(ngModel)]="description" class="input" placeholder="Introduce descripción" >
      </textarea>
      
    </div>

    <div class="mb-4 text-center">
        <label class="label-form">
            Foto del artista
        </label>

        <input type="file" #imageInput name="image" (change)="onImageSelected($event)"  accept="image/*" class="inline-block bg-gray-500 text-white px-4 py-2 rounded cursor-pointer  hover:bg-gray-600" />
    </div>

    <button type="submit" class="button-submit">
      Crear artista
    </button>

    <button type="button" class="button-back" (click)="back()">
      ← Volver
    </button>

  </form>
  
</div>
