<div class="relative h-28 overflow-hidden bg-orange-300 rounded-tl-lg rounded-tr-lg -mx-8 -mt-8 mb-8">

    <!-- Degradado para que el texto se lea -->
    <div class="absolute inset-0 bg-linear-to-t from-black via-black/40 to-transparent"></div>

    <div class="absolute top-8 left-5 text-white">
        
        <h1 class="text-2xl sm:text-3xl font-bold mb-2">
            Canciones
        </h1>
        
    </div>

</div>

@if (songs().length === 0) {

    <p class="mt-8 text-gray-500">
        No existen canciones.
    </p>

} @else {
    <table class="w-full text-left">

        <thead class="border-b border-gray-300">
            <tr>
                <th class="py-3 px-4"></th>
                <th class="hidden sm:table-cell py-3 px-4">#</th>
                <th class="py-3 px-4">Nombre</th>
                <th class="py-3 px-4">Duración</th>
                <th class="hidden sm:table-cell py-3 px-4">Albúm</th>
                
            </tr>
        </thead>

        <tbody>
            
                @for (song of songs(); track song._id) {

                    <tr class="border-b border-gray-200 hover:bg-gray-100 transition">

                        <!-- Reproducir -->
                        <td class="py-3 px-4 text-center">

                            <button
                                (click)="_playerService.playSong(song, songs())"
                                type="button"
                                class="text-orange-500 hover:text-orange-700 text-xl cursor-pointer"
                            >
                                <i class="fa-solid fa-circle-play"></i>
                            </button>

                        </td>
                        
                        <!-- Número -->
                        <td class="hidden sm:table-cell py-3 px-4">
                            {{ song.number }}
                        </td>

                        <!-- Nombre -->
                        <td class="py-3 px-4 font-semibold">
                            {{ song.name }}
                        </td>

                        <!-- Duración -->
                        <td class="py-3 px-4 text-gray-500">
                            {{ song.duration }}
                        </td>

                        <!-- Album -->
                        <td class="hidden sm:table-cell py-3 px-4 text-gray-500">
                            {{ song.album.title }}
                        </td>

                        @if (authService.identity()?.role === 'ROLE_ADMIN'){
                            <td class="py-3 px-4">
                                <!-- Botones -->
                                <div class="flex flex-col gap-2 items-center justify-center md:flex-row md:gap-2">

                                    <button
                                        [routerLink]="['/song/edit', song._id]"
                                        type="button"
                                        class="px-3 py-2 bg-blue-500 text-white rounded cursor-pointer hover:bg-blue-700 transition-all duration-300"
                                    >
                                    <i class="fa-solid fa-pen"></i>
                                    
                                    </button>

                                    <button
                                        (click)="onDeleteSong(song._id)"
                                        type="button"
                                        class="px-3 py-2 bg-red-500 text-white rounded cursor-pointer hover:bg-red-700 transition-all duration-300"
                                    >
                                    <i class="fa-solid fa-trash"></i>
                                    
                                    </button>

                                </div>
                            </td>
                        }

                    </tr>

                }
            
        </tbody>

    </table>
}
